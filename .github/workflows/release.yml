name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: MonsterGen-windows-x64
            ext: zip
          - os: ubuntu-latest
            artifact: MonsterGen-linux-x64
            ext: tar.gz
          - os: macos-latest
            artifact: MonsterGen-macos-arm64
            ext: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer PyInstaller et dépendances
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Construire le binaire
        run: pyinstaller monstergen.spec --noconfirm

      - name: Regrouper (Windows)
        if: matrix.os == 'windows-latest'
        run: Compress-Archive -Path dist/MonsterGen -DestinationPath ${{ matrix.artifact }}.zip

      - name: Regrouper (macOS/Linux)
        if: matrix.os != 'windows-latest'
        run: tar -czf ${{ matrix.artifact }}.tar.gz -C dist MonsterGen

      - name: Upload de l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.${{ matrix.ext }}

      - name: Attacher à la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.${{ matrix.ext }}
