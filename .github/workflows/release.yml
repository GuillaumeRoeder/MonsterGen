name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: MonsterGen-windows-x64
            ext: zip
          - os: ubuntu-latest
            artifact: MonsterGen-linux-x64
            ext: tar.gz
          - os: macos-latest
            artifact: MonsterGen-macos-arm64
            ext: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer PyInstaller et dépendances
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Construire le binaire
        run: pyinstaller monstergen.spec --noconfirm

      - name: Regrouper (Windows)
        if: matrix.os == 'windows-latest'
        run: Compress-Archive -Path dist/MonsterGen -DestinationPath ${{ matrix.artifact }}.zip

      - name: Regrouper (macOS/Linux)
        if: matrix.os != 'windows-latest'
        run: tar -czf ${{ matrix.artifact }}.tar.gz -C dist MonsterGen

      - name: Upload de l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.${{ matrix.ext }}

      - name: Attacher à la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.${{ matrix.ext }}

  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer PyInstaller, dépendances et outils AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libegl1 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 librsvg2-tools desktop-file-utils
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Construire le binaire
        run: pyinstaller monstergen.spec --noconfirm

      - name: Préparer l'arborescence AppDir
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/metainfo AppDir/usr/share/icons/hicolor/256x256/apps
          cp -r dist/MonsterGen/* AppDir/usr/bin/
          rsvg-convert -w 256 -h 256 assets/icon.svg \
            -o AppDir/usr/share/icons/hicolor/256x256/apps/monstergen.png
          cp AppDir/usr/share/icons/hicolor/256x256/apps/monstergen.png AppDir/monstergen.png
          cat > AppDir/monstergen.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=MonsterGen
          Comment=Générateur de fiches de PNJ, monstres et ennemis pour DnD 5e
          Exec=monstergen
          Icon=monstergen
          Categories=Game;Utility;
          EOF
          cat > AppDir/AppRun <<'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/MonsterGen" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Construire l'AppImage
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool AppDir MonsterGen-x86_64.AppImage

      - name: Attacher l'AppImage à la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: MonsterGen-x86_64.AppImage
